[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-browser"
version = "0.1.0"
description = "Browser Gym — navigate and interact with a web app via browser-like MCP tools"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.0",
    "fastmcp>=0.2.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
server = "browser_gym.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["browser_gym", "browser_gym.server"]
package-dir = {"browser_gym" = ".", "browser_gym.server" = "server"}

[tool.setuptools.package-data]
browser_gym = ["openenv.yaml"]
