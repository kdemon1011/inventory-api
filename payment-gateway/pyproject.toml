[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-payment-gateway"
version = "0.1.0"
description = "Payment Gateway environment for OpenEnv — Stripe-like payment processing"
requires-python = ">=3.10"
dependencies = [
    # Core OpenEnv runtime (provides FastAPI server + HTTP client types)
    "openenv-core[core]>=0.2.0",
    # Environment-specific dependencies
    "fastmcp>=0.2.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
server = "payment_gateway.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["payment_gateway", "payment_gateway.server"]
package-dir = {"payment_gateway" = ".", "payment_gateway.server" = "server"}

[tool.setuptools.package-data]
payment_gateway = ["openenv.yaml"]
