[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-inventory_clone"
version = "0.1.0"
description = "Inventory Clone environment for OpenEnv (MCP-tool pattern demo)"
requires-python = ">=3.10"
dependencies = [
    # Core OpenEnv runtime (provides FastAPI server + HTTP client types)
    "openenv-core[core]>=0.2.0",
    # MCP tool framework — required for MCPEnvironment + FastMCP
    "fastmcp>=0.2.0",
    # Server dependencies
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
]

[project.scripts]
# Server entry point — enables: uv run --project . server
server = "inventory_clone.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["inventory_clone", "inventory_clone.server"]
package-dir = { "inventory_clone" = ".", "inventory_clone.server" = "server" }
